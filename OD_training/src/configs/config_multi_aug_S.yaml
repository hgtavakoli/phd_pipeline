# config.yaml

# General Paths
paths:
  # IMPORTANT: This should be the parent directory containing your 'merged_experiment' folders
  base_data_dir: "/netscratch/tavakoli/documents/sd_light_od/cluster_experiments/dataset_experiments/fine_tuning_exp2"
  val_data_path: "/netscratch/tavakoli/documents/sd_light_od/cluster_experiments/data/val_new_2"
  test_data_path: "/netscratch/tavakoli/documents/sd_light_od/cluster_experiments/data/truck_new_2"

  #base_data_dir: "C:/Users/hota02/Documents/sd_light_od/cluster_experiments/dataset_experiments"
  #val_data_path: "C:/Users/hota02/Documents/sd_light_od/cluster_experiments/data/val_real"
  #test_data_path: "C:/Users/hota02/Documents/sd_light_od/cluster_experiments/data/val_real"

  yolo_project_dir: "yolo_runs_multi_mix_exp2_aug"
  custom_log_dir: "experiment_outputs_multi_mix_exp2_aug"

# Class Definitions
classes:
  names: ['Ylid', 'YTrailer', 'Cabin', 'Ggun', 'BLid', 'BTrailer', 'FChassis', 'Rchassis']
  # nc will be derived from len(names)

# Training Parameters
training:
  # === EXPERIMENT LOOP CONFIGURATION ===
  # The script will loop through every combination of these lists.
  datasets_to_train: ["experiment_multi"]
  exp_names_to_train: ["merged_experiment2"] # e.g., ["merged_experiment0", "merged_experiment1", "merged_experiment2"]
  sizes_to_train: ['S']
  cameras_to_train: [ 'camera1','camera2'] # <-- ADD THIS NEW LIST

  # === YOLO model.train() arguments ===
  weights: "yolov12l.pt" # Pretrained weights
  epochs: 200 # 100
  img_size: 640
  batch_size: 32 # Per GPU batch size 32
  save_period: 10 # Save checkpoint every N epochs

  # --- AUGMENTATIONS ---
  hsv_h: 0.0 #0.015
  degrees: 0
  scale: 0.0
  translate: 0.0
  shear: 0.0
  perspective: 0.0
  fliplr: 0
  flipud: 0
  mosaic: 0
  mixup: 0
  copy_paste: 0
  # device: None # Let DDP handle this automatically

# Evaluation Parameters
evaluation:
  # The evaluator will use 'yolo_project_dir' from above to find trained models.
  img_size: 640
  batch_size: 32
  split_to_eval_on: 'test' # Which data split to use for evaluation: 'val' or 'test'

# Reproducibility
random_seed: 42